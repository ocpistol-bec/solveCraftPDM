# Development compose stack for the PDM platform.
#   docker compose -f apps/pdm/docker/pdm-dev.yml up -d
# Then run `pdm-cli` ops through the container:
#   docker compose -f apps/pdm/docker/pdm-dev.yml run --rm pdm pdm-cli create-org --name "Acme"
#
# The PDM server runs migrations on boot and serves the in-process worker.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pdm
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: pdm
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdm -d pdm"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pdm
      MINIO_ROOT_PASSWORD: pdmsecret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "sleep 3; mc alias set local http://minio:9000 pdm pdmsecret; mc mb --ignore-existing local/pdm"
    restart: "no"

  pdm:
    build:
      context: ../..            # repo root, so both workspaces are available
      dockerfile: apps/pdm/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PDM_DATABASE_URL: postgresql://pdm:pdm@postgres:5432/pdm
      PDM_S3_ENDPOINT: http://minio:9000
      PDM_S3_BUCKET: pdm
      PDM_S3_ACCESS_KEY: pdm
      PDM_S3_SECRET_KEY: pdmsecret
      PDM_WORKER: "1"
      PDM_LOCK_LEASE_HOURS: "24"
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
